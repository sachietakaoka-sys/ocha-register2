<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8f3"><title>お茶販売レジ</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#20372b;background:#f6f8f3}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}header{padding:14px 16px 9px;background:#fff;border-bottom:1px solid #e0e7df}h1{font-size:21px;margin:0}header small{color:#66796d}main{max-width:620px;margin:auto;padding:12px 12px 110px}h2{font-size:16px;margin:8px 0 10px}.panel{background:white;border:1px solid #e1e8e0;border-radius:15px;padding:12px;margin-bottom:12px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.product{border:1px solid #d6e2d6;border-radius:11px;background:#f9fbf7;min-height:62px;padding:7px 3px;font-size:14px;font-weight:700;line-height:1.3}.product:active,.product.selected{background:#dcefd9;border-color:#518d62}.product small{display:block;font-size:11px;color:#657467;font-weight:500;margin-top:3px}.variant{display:none;margin-top:10px;background:#f0f7ef;border-radius:12px;padding:10px}.variant.show{display:block}.variant-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.variant-grid button{background:white;border:1px solid #bcd2bb;border-radius:9px;padding:11px 5px;font-size:13px}.variant-grid button strong{display:block;font-size:15px}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #edf0eb;padding:9px 0}.line:last-child{border:0}.name{flex:1;min-width:0;font-size:14px;font-weight:600}.sub{font-size:12px;color:#69766c;font-weight:400}.step{display:flex;align-items:center;gap:8px}.step button{height:36px;width:36px;border-radius:9px;border:1px solid #9cb99e;background:#f3f9f1;font-size:22px;font-weight:600}.step b{min-width:18px;text-align:center}.price{font-size:14px;font-weight:700;min-width:66px;text-align:right}.empty{font-size:13px;color:#718075;padding:10px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce6dc;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px #20372b0c}.bottom-inner{max-width:620px;margin:auto;display:flex;align-items:center;gap:12px}.total{flex:1}.total small{display:block;color:#607266}.total strong{font-size:23px}.primary{border:0;background:#267047;color:white;border-radius:12px;padding:13px 17px;font-weight:750}.primary:disabled{opacity:.4}.secondary{background:white;border:1px solid #9cb5a1;border-radius:10px;padding:10px 12px;color:#24583a;font-weight:700}.receipt{background:white;border:1px solid #e1e8e0;border-radius:15px;padding:16px;margin-bottom:12px}.receipt h2{text-align:center;font-size:19px}.receipt-row{display:grid;grid-template-columns:1fr 42px 85px;gap:5px;padding:9px 0;border-bottom:1px dashed #d7dfd7;font-size:14px}.receipt-row span:nth-child(2),.receipt-row span:nth-child(3){text-align:right}.receipt-total{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800;padding-top:16px}.cash{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0}.cash button{padding:10px 2px;background:#f2f7f1;border:1px solid #d2e0d1;border-radius:9px;font-size:13px;font-weight:700}input{width:100%;font-size:23px;font-weight:700;border:1px solid #9bb8a0;border-radius:10px;padding:10px 12px;text-align:right}.change{background:#eaf5e8;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}.change strong{font-size:27px}.muted{color:#68796c;font-size:12px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.hidden{display:none!important}@media(max-width:365px){.product{font-size:12px}.products{gap:5px}.price{min-width:57px;font-size:12px}.step{gap:4px}.step button{width:32px}}
 .dialog-overlay{position:fixed;inset:0;background:#17291c99;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(100%,380px);background:#fff;border-radius:22px;padding:25px 20px;box-shadow:0 16px 50px #0003;text-align:center}.dialog h2{font-size:23px;margin:0 0 14px}.dialog p{font-size:13px;color:#637568;line-height:1.7}.dialog button{width:100%;margin-top:9px;padding:13px;font-weight:700;border-radius:12px} </style></head><body><header><h1>🍵 お茶販売レジ v6</h1><small id="subtitle">商品を選んでください</small></header><main><section id="selection"><div class="panel"><h2>商品を選択</h2><div class="products" id="products"></div><div id="variant" class="variant"><strong id="variant-title"></strong><div class="variant-grid" id="variant-grid"></div></div></div><div class="panel"><h2>選択した商品 <span id="count-label" class="muted"></span></h2><div id="cart"><div class="empty">まだ商品が選ばれていません</div></div></div></section><section id="checkout" class="hidden"><div class="receipt"><h2>お買い上げ明細</h2><div class="muted" style="text-align:center;margin-bottom:10px">内容と数量をご確認ください</div><div id="receipt-lines"></div><div class="receipt-total"><span id="receipt-count"></span><span id="receipt-total"></span></div></div><div class="panel"><h2>お預かり金額</h2><div class="cash" id="cash-buttons"></div><label class="muted" for="cash">金額を直接入力（円）</label><input id="cash" type="number" min="0" inputmode="numeric" placeholder="0"><div class="change"><span>お釣り</span><strong id="change">—</strong></div><div class="actions"><button class="secondary" id="back">← 商品選択に戻る</button><button class="primary" id="next">次のお客様</button></div></div></section></main><div id="finish-dialog" class="dialog-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="finish-title"><div class="dialog"><h2 id="finish-title">🍵 お会計完了？</h2><p>OKを押すと、今回のお買い物内容がリセットされます。</p><button class="secondary" id="edit-items">商品数変更</button><button class="secondary" id="review-receipt">確認に戻る</button><button class="primary" id="finish-ok">OK（次のお客様）</button></div></div><div class="bottom" id="bottom"><div class="bottom-inner"><div class="total"><small id="summary-count">0点</small><strong id="summary-total">0円</strong></div><button class="primary" id="checkout-button" disabled>お会計へ →</button></div></div><script>
const items=[{name:'花ここち',variants:[['リーフ50g',900],['リーフ30g',550],['TB 2.5g×10個',900],['TB 2.5g×6個',550]]},{name:'花つづみ',variants:[['リーフ50g',900],['リーフ30g',550],['TB 2.5g×10個',900],['TB 2.5g×6個',550]]},{name:'香 つゆひかり Pre',variants:[['リーフ30g',1100]]},{name:'香 香駿 Premium',variants:[['リーフ30g',1100]]},{name:'花かげや',variants:[['リーフ30g',600]]},{name:'初夏摘み',variants:[['リーフ20g',550]]},{name:'夕暮れのたび',variants:[['リーフ25g',600]]},{name:'木の芽ながし',variants:[['リーフ25g',600]]},{name:'つむぎ',variants:[['リーフ40g',600]]},{name:'まどか',variants:[['リーフ40g',600]]},{name:'特蒸しティーバッグ',variants:[['リーフ25g',600]]}];
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ja-JP')+'円';let cart={},active=null,highlight=null;const getKey=(i,j)=>i+'-'+j;function totals(){let count=0,total=0;for(const [key,q] of Object.entries(cart)){let [i,j]=key.split('-').map(Number);count+=q;total+=q*items[i].variants[j][1]}return {count,total}}
function add(i,j){const k=getKey(i,j);cart[k]=(cart[k]||0)+1;render()}function adjust(k,d){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];render()}
function select(i){const item=items[i];highlight=i;if(item.variants.length===1){active=null;add(i,0);renderVariants();renderButtons();return}active=active===i?null:i;renderVariants();renderButtons()}
function renderButtons(){$('products').innerHTML='';items.forEach((item,i)=>{let b=document.createElement('button');b.className='product'+(highlight===i?' selected':'');let price=item.variants.length===1?fmt(item.variants[0][1]):'内容量を選択';b.innerHTML='';b.append(document.createTextNode(item.name));let s=document.createElement('small');s.textContent=price;b.append(s);b.onclick=()=>select(i);$('products').append(b)})}
function renderVariants(){const v=$('variant');v.classList.toggle('show',active!==null);$('variant-grid').replaceChildren();if(active===null)return;const item=items[active];$('variant-title').textContent=item.name+'｜内容量を選択';item.variants.forEach(([size,price],j)=>{const b=document.createElement('button');const a=document.createElement('strong');a.textContent=size;const p=document.createElement('span');p.textContent=fmt(price);b.append(a,p);b.onclick=()=>{add(active,j);active=null;renderVariants();renderButtons()};$('variant-grid').append(b)})}
function entryOrder(){return Object.entries(cart)}
function render(){const {count,total}=totals();$('summary-count').textContent=count+'点';$('summary-total').textContent=fmt(total);$('count-label').textContent='('+count+'点)';$('checkout-button').disabled=count===0;const root=$('cart');root.replaceChildren();if(!count){root.innerHTML='<div class="empty">まだ商品が選ばれていません</div>'}entryOrder().slice().reverse().forEach(([k,q])=>{let [i,j]=k.split('-').map(Number),it=items[i],v=it.variants[j];let line=document.createElement('div');line.className='line';let name=document.createElement('div');name.className='name';name.textContent=it.name;let sub=document.createElement('div');sub.className='sub';sub.textContent=v[0]+'・'+fmt(v[1]);name.append(sub);let step=document.createElement('div');step.className='step';let minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','1点減らす');minus.onclick=()=>adjust(k,-1);let num=document.createElement('b');num.textContent=q;let plus=document.createElement('button');plus.textContent='＋';plus.setAttribute('aria-label','1点増やす');plus.onclick=()=>adjust(k,1);step.append(minus,num,plus);let price=document.createElement('div');price.className='price';price.textContent=fmt(q*v[1]);line.append(name,step,price);root.append(line)})}
function receipt(){let {count,total}=totals();$('receipt-lines').replaceChildren();entryOrder().forEach(([k,q])=>{let [i,j]=k.split('-').map(Number),it=items[i],v=it.variants[j];let r=document.createElement('div');r.className='receipt-row';for(let val of [it.name+' '+v[0],q+'点',fmt(q*v[1])]){let s=document.createElement('span');s.textContent=val;r.append(s)}$('receipt-lines').append(r)});$('receipt-count').textContent='合計 '+count+'点';$('receipt-total').textContent=fmt(total);updateChange()}
function updateChange(){const raw=$('cash').value,{total}=totals();if(raw===''){$('change').textContent='—';return}let paid=Number(raw);$('change').textContent=paid<total?'不足 '+fmt(total-paid):fmt(paid-total)}
function showCheckout(on){$('selection').classList.toggle('hidden',on);$('checkout').classList.toggle('hidden',!on);$('bottom').classList.toggle('hidden',on);$('subtitle').textContent=on?'明細確認・お釣り計算':'商品を選んでください';if(on)receipt();window.scrollTo(0,0)}
$('checkout-button').onclick=()=>showCheckout(true);$('back').onclick=()=>showCheckout(false);$('cash').addEventListener('input',updateChange);const exactButton=document.createElement('button');exactButton.textContent='ぴったり';exactButton.style.background='#d9efdb';exactButton.style.borderColor='#72a87b';exactButton.onclick=()=>{$('cash').value=totals().total;updateChange()};$('cash-buttons').append(exactButton);[1000,2000,3000,5000,10000].forEach(n=>{let b=document.createElement('button');b.textContent=fmt(n);b.onclick=()=>{$('cash').value=n;updateChange()};$('cash-buttons').append(b)});$('cash-buttons').lastElementChild.after();const dialog=$('finish-dialog');$('next').onclick=()=>dialog.classList.remove('hidden');$('edit-items').onclick=()=>{dialog.classList.add('hidden');showCheckout(false)};$('review-receipt').onclick=()=>dialog.classList.add('hidden');
function thankYou(){const phrases=['ありがとうございます！','おおきに！','さんきゅー！'];const phrase=phrases[Math.floor(Math.random()*phrases.length)];if('speechSynthesis' in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(phrase);u.lang='ja-JP';u.rate=2;u.pitch=1.15;u.volume=1;speechSynthesis.speak(u)}catch(e){}}}
$('finish-ok').onclick=()=>{dialog.classList.add('hidden');thankYou();cart={};active=null;highlight=null;$('cash').value='';renderVariants();renderButtons();render();showCheckout(false)};renderButtons();render();
</script></body></html>
